<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bán trú</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#5b1a14;--ol:#9b2a1f;--mute:#8a5a44;--line:#e8c8bf;--card:#fff;--g:#1a7a4a;--gl:#d8f5e6;--r:#c62f35;--rl:#ffe1e1;--y:#8a5d00;--yl:#fff2bf;--acc:#1fa496;--accs:#147a6f;--accl:#e1f6f3}
.c1{--acc:#1fa496;--accs:#147a6f;--accl:#e1f6f3}.c2{--acc:#f08a1c;--accs:#b8620a;--accl:#fff0dc}
.c3{--acc:#3f6fe0;--accs:#2a4aa8;--accl:#e3ebff}.c4{--acc:#c9409f;--accs:#92296f;--accl:#fbe3f3}.c5{--acc:#e0524d;--accs:#a93632;--accl:#ffe3e1}
*{box-sizing:border-box}
html{background:linear-gradient(#6ec6ff 0%,#a9ddff 35%,#d2f0ff 62%)}
body{margin:0;min-height:100vh;font:17px/1.5 Nunito,system-ui,sans-serif;color:var(--ink)}
body::before{content:"";position:fixed;inset:auto 0 0 0;height:40vh;z-index:-2;background:radial-gradient(ellipse 75% 70% at 12% 100%,#86d445 0 99%,transparent 100%),radial-gradient(ellipse 85% 85% at 92% 100%,#5eb62c 0 99%,transparent 100%),linear-gradient(#7fcb3c,#58a828)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80px 24px at 14% 9%,#fff 0 62%,transparent 66%),radial-gradient(ellipse 110px 30px at 84% 17%,#fff 0 62%,transparent 66%);opacity:.9}
.w{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1,h2,.big b,.hero .n{font-family:"Baloo 2",Nunito,sans-serif}
.top{text-align:center;padding:10px 0 4px}
.mascot{font-size:60px;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
h1{font-size:42px;font-weight:800;margin:2px 0 0;line-height:1.1;color:#fff;-webkit-text-stroke:7px var(--ol);paint-order:stroke fill;text-shadow:0 4px 0 rgba(155,42,31,.35)}
.sub{color:#1c4f7c;margin:0 0 14px;font-weight:800}
.top .sub{margin-top:6px}
.bar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin-bottom:16px}
h2{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;padding:6px 10px;background:#fff;border:3px solid var(--ol);border-radius:16px;box-shadow:0 4px 0 rgba(155,42,31,.3);font-size:20px;font-weight:800;line-height:1.2;text-align:center}
.ic{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f5a623);border:2.5px solid #b8621b;box-shadow:0 2px 0 #b8621b;font-style:normal;font-size:17px}
.back{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc861,#f08a1c);border:3px solid #b8621b;box-shadow:0 4px 0 #b8621b;color:#fff;font:800 26px/1 Nunito,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;padding:0}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 #b8621b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.grid .big:last-child:nth-child(odd){grid-column:1/-1}
.big{display:flex;flex-direction:column;align-items:center;border:0;border-radius:22px;padding:14px 10px 12px;text-align:center;font:inherit;color:#fff;cursor:pointer;min-height:136px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 78%,#fff),var(--acc));box-shadow:0 6px 0 var(--accs),0 10px 14px rgba(0,0,0,.18);transition:transform .12s,box-shadow .12s}
.big i{display:grid;place-items:center;width:56px;height:56px;margin-bottom:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f5a623);border:3px solid #b8621b;box-shadow:0 3px 0 #b8621b;font-style:normal;font-size:28px}
.big b{display:block;font-size:19px;font-weight:800;line-height:1.2;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.big span{margin-top:2px;font-size:13px;font-weight:700;color:#fff;opacity:.95;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--accs)}
.big:focus-visible,.btn:focus-visible,.back:focus-visible{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 7px var(--ol)}
.card{background:var(--card);border:3px solid var(--ol);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(155,42,31,.3)}
label{display:block;font-size:15px;font-weight:800;margin:12px 0 5px}
select,input,textarea{width:100%;font:inherit;font-weight:700;padding:10px 12px;border:3px solid #d49a8c;border-radius:14px;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:3px solid var(--acc);outline-offset:1px;border-color:var(--ol)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}
.btn{width:100%;margin-top:14px;padding:11px;border:0;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));color:#fff;font:inherit;font-size:17px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.3);cursor:pointer;box-shadow:0 5px 0 var(--accs);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accs)}
.btn:disabled{opacity:.55}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:2.5px dashed var(--line);font-weight:700}
.row:last-child{border:0}.row small{color:var(--mute);display:block;font-weight:600}
.rp{display:grid;grid-template-columns:1fr 58px 50px 58px;gap:6px;align-items:center}
.rph{font-size:12px;line-height:1.15;font-weight:800;color:var(--mute);padding-bottom:6px;border-bottom:2.5px dashed var(--line)}
.rph span+span,.pill{text-align:center}
.pill{padding:3px 0;border-radius:12px;font-size:15px;font-weight:800}
summary{font-weight:800;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:' ▾';color:var(--mute)}details[open] summary::after{content:' ▴'}
#rpXls{margin:0 0 14px}
.tag{padding:4px 12px;border-radius:99px;font-size:14px;font-weight:800;white-space:nowrap}
.an{background:var(--gl);color:var(--g)}.vang{background:var(--rl);color:var(--r)}.chua{background:var(--yl);color:var(--y)}.nd{background:#e8eef4;color:#5d6b7a}
.tag.an::before{content:"😋 "}.tag.vang::before{content:"🙈 "}.tag.chua::before{content:"⏳ "}.tag.nd::before{content:"📅 "}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#ffd75e,#ff9f2e);color:var(--ink);border:3px solid #b8621b;border-radius:22px;padding:14px 20px;margin-bottom:14px;box-shadow:0 5px 0 #b8621b,0 10px 14px rgba(0,0,0,.15)}
.hero .n{font-size:62px;font-weight:800;line-height:1}.hero p{margin:6px 0 0;font-weight:800}
.hero .hi{position:absolute;right:14px;top:8px;font-size:58px;animation:bob 2.8s ease-in-out infinite}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:6px 14px;border:3px solid var(--ol);border-radius:99px;background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--accs);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.sgb{display:block;width:100%;text-align:left;font:inherit;font-weight:800;color:inherit;padding:10px 12px;margin-top:8px;background:#fff;border:3px solid var(--ol);border-radius:16px;box-shadow:0 3px 0 rgba(155,42,31,.3);cursor:pointer}
.sgb small{color:var(--mute);margin-left:6px;font-weight:700}.sgb:hover,.sgb:focus-visible{background:var(--accl)}
.msg{padding:12px 14px;border-radius:16px;margin-top:12px;font-weight:800;border:2.5px solid currentColor}
.ok{background:var(--gl);color:var(--g)}.er{background:var(--rl);color:var(--r)}.wn{background:var(--yl);color:var(--y)}
#reader{width:100%;border-radius:18px;overflow:hidden;border:4px solid var(--ol)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="w">

<section id="home">
  <div class="top"><div class="mascot">🍚</div><h1>Bán trú</h1><p class="sub">Bữa trưa của các bé ở trường 🌈</p></div>
  <div class="grid">
    <button class="big c1" data-go="lookup"><i>🔍</i><b>Tra cứu học sinh</b><span>Xem ngày ăn, ngày vắng</span></button>
    <button class="big c2" data-go="absent"><i>📝</i><b>Đăng ký vắng</b><span>Báo vắng bán trú</span></button>
    <button class="big c3" data-go="stats"><i>📊</i><b>Thống kê</b><span>Danh sách hôm nay</span></button>
    <button class="big c4" data-go="scan"><i>📷</i><b>Quét QR</b><span>Dành cho giáo viên</span></button>
    <button class="big c5" data-go="report"><i>📅</i><b>Báo cáo tháng</b><span>Đã nhận, vắng, chưa nhận</span></button>
  </div>
</section>

<section id="lookup" class="c1" hidden>
  <div class="bar"><button class="back" data-go="home" aria-label="Về trang chủ">←</button><h2><i class="ic">🔍</i>Tra cứu học sinh</h2></div>
  <div class="card"><div class="pk"></div>
    <label>Tháng cần xem</label><input type="month" id="lkMonth">
    <button class="btn" id="lkBtn">Xem</button></div>
  <div id="lkOut"></div>
</section>

<section id="absent" class="c2" hidden>
  <div class="bar"><button class="back" data-go="home" aria-label="Về trang chủ">←</button><h2><i class="ic">📝</i>Đăng ký vắng bán trú</h2></div>
  <div id="abClosed" class="msg er" hidden>Ngoài thời gian đăng ký. Mở từ 13:00 đến 05:00 sáng hôm sau.</div>
  <div class="card" id="abForm"><div class="pk"></div>
    <label>Ngày vắng</label><input type="date" id="abDate"><small id="abThu" style="color:var(--mute)"></small>
    <label class="chk"><input type="checkbox" id="abChk"> Có lý do</label>
    <textarea id="abReason" rows="2" placeholder="Ví dụ: con bị ốm" disabled></textarea>
    <button class="btn" id="abBtn">Gửi đăng ký</button><div id="abMsg"></div></div>
</section>

<section id="stats" class="c3" hidden>
  <div class="bar"><button class="back" data-go="home" aria-label="Về trang chủ">←</button><h2><i class="ic">📊</i>Thống kê</h2></div>
  <div class="hero"><span class="hi">🍲</span><div class="n" id="stCook">–</div><p id="stSub">Suất cần nấu</p></div>
  <div id="stWarn"></div>
  <label>Ngày xem</label><input type="date" id="stDate"><label>Lớp</label><select id="stLop"><option value="">Tất cả lớp</option></select>
  <div class="tabs" style="margin-top:10px"></div>
  <div class="card" id="stList"></div>
</section>

<section id="report" class="c5" hidden>
  <div class="bar"><button class="back" data-go="home" aria-label="Về trang chủ">←</button><h2><i class="ic">📅</i>Báo cáo tháng</h2></div>
  <details class="card"><summary>🔎 Lọc theo tháng, khối, lớp</summary>
    <label>Tháng</label><input type="month" id="rpMonth">
    <label>Khối</label><select id="rpKhoi"></select>
    <label>Lớp</label><select id="rpLop"></select>
  </details>
  <button class="btn" id="rpXls" disabled>📥 Xuất Excel</button>
  <div id="rpOut"></div>
</section>

<section id="scan" class="c4" hidden>
  <div class="bar"><button class="back" data-go="home" aria-label="Về trang chủ">←</button><h2><i class="ic">📷</i>Quét QR nhận suất</h2></div>
  <div class="card" id="scLogin"><label>Mật khẩu giáo viên</label><input type="password" id="scPass" autocomplete="current-password">
    <button class="btn" id="scLoginBtn">Mở máy quét</button><div id="scLoginMsg"></div></div>
  <div id="scBox" hidden><div id="scQ" class="sub"></div><div id="reader"></div><div id="scMsg"></div>
    <div class="card" style="margin-top:12px"><label>Hoặc nhập mã học sinh (máy quét mã vạch tự gõ và Enter)</label><input id="scManual" inputmode="numeric" autocomplete="off"><button class="btn" id="scManualBtn">Xác nhận nhận suất</button></div></div>
</section>

</div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// Dán địa chỉ Web App của Apps Script vào đây
const API='=https://script.google.com/macros/s/AKfycbz2bfIDlck2Imzt-rA05N8_YaXukNZSd2kwzhk7L0XHUk7OzM7WwkRIVV6-eYzIm_S-YA/exec';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const THU=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
let pass='',timer=null,qr=null,last='',lastT=0;

async function api(o){const r=await fetch(API,{method:'POST',body:JSON.stringify(o)});return r.json()}
function vn(){const o={};new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(p=>o[p.type]=p.value);return{date:`${o.year}-${o.month}-${o.day}`,h:+o.hour}}
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function fmt(s){const[y,m,d]=s.split('-');return`${d}/${m}/${y}`}
function thu(s){return THU[new Date(s+'T00:00:00Z').getUTCDay()]}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function go(id){
  $$('section').forEach(s=>s.hidden=s.id!==id);
  clearInterval(timer);stopQR();
  if(id==='lookup')needPicker('lookup','#lookup .pk');
  if(id==='report')initReport();
  if(id==='absent')initAbsent();
  if(id==='stats'){$('#stDate').value=vn().date;loadStats();timer=setInterval(loadStats,30000)}
  window.scrollTo(0,0);
}
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

// ---- Chọn khối + lớp, gõ tên học sinh rồi chọn đúng bạn trong gợi ý
let classes=[];
const nat=(x,y)=>String(x).localeCompare(String(y),'vi',{numeric:true});
function picker(box){
  box.innerHTML='<label>Khối</label><select class="k"></select><label>Lớp</label><select class="l"></select><label>Họ tên học sinh</label><input class="n" placeholder="Gõ tên con (có dấu hoặc không dấu)" autocomplete="off"><div class="sg"></div><div class="pick msg ok" hidden></div>';
  const k=box.querySelector('.k'),l=box.querySelector('.l'),n=box.querySelector('.n'),sg=box.querySelector('.sg'),pk=box.querySelector('.pick');
  let sel=null,t=0;
  const opt=(el,a,ph)=>el.innerHTML=`<option value="">${ph}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join('');
  const reset=()=>{sel=null;n.value='';sg.innerHTML='';pk.hidden=true};
  const fill=()=>{opt(k,[...new Set(classes.map(c=>c.khoi))].sort(nat),'Chọn khối');opt(l,[],'Chọn lớp')};
  fill();
  k.onchange=()=>{opt(l,classes.filter(c=>c.khoi==k.value).map(c=>c.lop).sort(nat),'Chọn lớp');reset()};
  l.onchange=reset;
  n.oninput=()=>{
    sel=null;pk.hidden=true;clearTimeout(t);
    if(!k.value||!l.value){sg.innerHTML='<p class="sub">Chọn khối và lớp trước.</p>';return}
    if(!n.value.trim()){sg.innerHTML='';return}
    t=setTimeout(async()=>{
      try{
        const r=await api({action:'find',khoi:k.value,lop:l.value,name:n.value});
        if(!r.ok)throw new Error(r.error);
        sg.innerHTML=r.list.length?r.list.map((x,i)=>`<button type="button" class="sgb" data-i="${i}">${esc(x.ten)} <small>Lớp ${esc(x.lop)} · MSHS ${esc(x.id)}</small></button>`).join(''):'<p class="sub">Không thấy học sinh này trong lớp đã chọn.</p>';
        sg.querySelectorAll('.sgb').forEach(b=>b.onclick=()=>{sel=r.list[b.dataset.i];n.value=sel.ten;sg.innerHTML='';pk.hidden=false;pk.textContent=`Đã chọn: ${sel.ten} – Lớp ${sel.lop} – MSHS ${sel.id}`});
      }catch(e){sg.innerHTML=`<div class="msg er">${esc(e.message)}</div>`}
    },300);
  };
  const get=()=>sel&&sel.id;get.fill=fill;return get;
}
const getters={};
async function needPicker(id,sel){
  const box=$(sel);
  if(!getters[id]){box.innerHTML='';getters[id]=picker(box)}
  let er=box.parentNode.querySelector('.apierr');
  if(!er){er=document.createElement('div');er.className='msg er apierr';er.hidden=true;box.parentNode.insertBefore(er,box)}
  if(classes.length){getters[id].fill();er.hidden=true;return}
  try{
    const r=await api({action:'classes'});if(!r.ok)throw new Error(r.error);
    classes=r.classes;Object.values(getters).forEach(g=>g.fill());er.hidden=true;
    if(!classes.length){er.textContent='Chưa có dữ liệu học sinh trong Google Sheet (trang HocSinh).';er.hidden=false}
  }catch(e){er.textContent='Chưa kết nối được dữ liệu: '+e.message+'. Kiểm tra địa chỉ API và việc triển khai Apps Script.';er.hidden=false}
}
needPicker('lookup','#lookup .pk');
$('#lkMonth').value=vn().date.slice(0,7);

// ---- Tra cứu
$('#lkBtn').onclick=async()=>{
  const id=getters.lookup&&getters.lookup();
  if(!id){$('#lkOut').innerHTML='<div class="msg wn">Chọn khối, lớp, gõ tên rồi bấm chọn đúng học sinh trong gợi ý.</div>';return}
  $('#lkOut').innerHTML='<p class="sub">Đang tải…</p>';
  try{
    const r=await api({action:'history',id,month:$('#lkMonth').value});
    if(!r.ok)throw new Error(r.error);
    const c=k=>r.days.filter(d=>d.s===k).length;
    const L={vang:'Vắng',nhan:'Đã nhận suất ăn',chua:'Chưa nhận suất ăn',nodata:'Chưa có dữ liệu'},T={vang:'vang',nhan:'an',chua:'chua',nodata:'nd'};
    $('#lkOut').innerHTML=`<div class="card"><b>${esc(r.ten)}</b> – Lớp ${esc(r.lop)}<br><span class="sub">Đã nhận ${c('nhan')} · Chưa nhận ${c('chua')} · Vắng ${c('vang')}</span>`+
      (r.days.length?r.days.map(d=>`<div class="row"><div>${thu(d.d)}, ${fmt(d.d)}${d.lydo?`<small>Lý do: ${esc(d.lydo)}</small>`:''}</div><span class="tag ${T[d.s]}">${L[d.s]}</span></div>`).join(''):'<p>Không có ngày học trong tháng này.</p>')+'</div>';
  }catch(e){$('#lkOut').innerHTML=`<div class="msg er">${esc(e.message)}</div>`}
};

// ---- Đăng ký vắng
function window13(){return vn().h>=13||vn().h<5}
function nextMealDate(){const n=vn();return n.h>=13?addDays(n.date,1):n.date}
function initAbsent(){
  const open=window13();
  $('#abClosed').hidden=open;$('#abForm').hidden=!open;
  if(!open)return;
  needPicker('absent','#absent .pk');
  const min=nextMealDate();$('#abDate').min=min;$('#abDate').max=addDays(min,60);
  if(!$('#abDate').value||$('#abDate').value<min)$('#abDate').value=min;
  $('#abDate').onchange=()=>$('#abThu').textContent=thu($('#abDate').value);$('#abDate').onchange();
}
$('#abChk').onchange=e=>{$('#abReason').disabled=!e.target.checked;if(!e.target.checked)$('#abReason').value=''};
$('#abBtn').onclick=async()=>{
  const id=getters.absent&&getters.absent(),m=$('#abMsg');
  if(!id){m.innerHTML='<div class="msg wn">Chọn khối, lớp, gõ tên rồi bấm chọn đúng học sinh trong gợi ý.</div>';return}
  if(!window13()){initAbsent();return}
  $('#abBtn').disabled=true;
  try{
    const r=await api({action:'absent',id,date:$('#abDate').value,reason:$('#abReason').value.trim()});
    if(!r.ok)throw new Error(r.error);
    m.innerHTML=`<div class="msg ok">Đã đăng ký vắng ${thu($('#abDate').value)}, ${fmt($('#abDate').value)} cho ${esc(r.ten)}.</div>`;
  }catch(e){m.innerHTML=`<div class="msg er">${esc(e.message)}</div>`}
  $('#abBtn').disabled=false;
};

// ---- Thống kê
let stData=null,stFilter='all';
const LBL={all:'Tất cả',chua:'Chưa nhận',nhan:'Đã nhận',vang:'Vắng'};
const TAGS={nhan:['an','Đã nhận suất ăn'],vang:['vang','Vắng bán trú'],cho:['nd','Chưa đến ngày'],chua:['chua','Chưa nhận suất ăn']};
const inTab=(x,k)=>k==='all'||(k==='vang'?x.v:x.s===k);
function drawTabs(){
  const keys=stData&&stData.date>stData.today?['all','vang']:Object.keys(LBL);
  if(!keys.includes(stFilter))stFilter='all';
  $('#stats .tabs').innerHTML=keys.map(k=>{
    const n=stData?stData.list.filter(x=>inTab(x,k)).length:0;
    return`<button class="${stFilter===k?'on':''}" data-f="${k}">${LBL[k]} (${n})</button>`}).join('');
  $$('#stats .tabs button').forEach(b=>b.onclick=()=>{stFilter=b.dataset.f;drawTabs();drawList()});
}
function drawList(){
  if(!stData)return;
  const lop=$('#stLop').value;
  const a=stData.list.filter(x=>inTab(x,stFilter)&&(!lop||x.lop==lop));
  $('#stList').innerHTML=a.length?a.map(x=>{const t=stFilter==='vang'?TAGS.vang:(TAGS[x.s]||TAGS.chua);return`<div class="row"><div>${esc(x.ten)}<small>Lớp ${esc(x.lop)}${x.v&&x.lydo?' · Lý do: '+esc(x.lydo):''}${x.v&&x.s==='nhan'&&stFilter!=='vang'?' · đã báo vắng':''}${x.v&&x.s==='nhan'&&stFilter==='vang'?' · vẫn đến nhận suất':''}</small></div><span class="tag ${t[0]}">${t[1]}</span></div>`}).join(''):`<p class="sub">${stFilter==='vang'?'Không có học sinh nào đăng ký vắng.':'Không có học sinh.'}</p>`;
}
async function loadStats(){
  try{
    const r=await api({action:'stats',date:$('#stDate').value||vn().date});if(!r.ok)throw new Error(r.error);
    stData=r;$('#stCook').textContent=r.cook;
    $('#stWarn').innerHTML=r.unmatched&&r.unmatched.length?`<div class="msg wn">Có ${r.unmatched.length} dòng vắng không khớp học sinh nào (MSHS: ${r.unmatched.map(esc).join(', ')}). Số vắng ở trên chưa tính các dòng này, hãy kiểm tra trang VangBanTru.</div>`:'';
    $('#stSub').textContent=`Suất cần nấu ${thu(r.date)}, ${fmt(r.date)} · Tổng ${r.total} − vắng ${r.vang}`;
    const ls=[...new Set(r.list.map(x=>x.lop))].sort((a,b)=>String(a).localeCompare(String(b),'vi',{numeric:true}));
    const cur=$('#stLop').value;$('#stLop').innerHTML='<option value="">Tất cả lớp</option>'+ls.map(l=>`<option>${esc(l)}</option>`).join('');$('#stLop').value=cur;
    drawTabs();drawList();
  }catch(e){$('#stList').innerHTML=`<div class="msg er">${esc(e.message)}</div>`}
}
$('#stLop').onchange=drawList;
$('#stDate').onchange=()=>{stFilter='all';loadStats()};

// ---- Báo cáo tháng: vào là hiện cả danh sách, bộ lọc là tuỳ chọn
let rpData=null,rpSeq=0,rpTimer=0;
async function initReport(){
  if(!$('#rpMonth').value)$('#rpMonth').value=vn().date.slice(0,7);
  try{
    if(!classes.length){const r=await api({action:'classes'});if(!r.ok)throw new Error(r.error);classes=r.classes}
    const ks=[...new Set(classes.map(c=>c.khoi))].sort(nat);
    $('#rpKhoi').innerHTML='<option value="">Tất cả khối</option>'+ks.map(k=>`<option>${esc(k)}</option>`).join('');
    rpLops();runReport();
  }catch(e){$('#rpOut').innerHTML=`<div class="msg er">Chưa kết nối được dữ liệu: ${esc(e.message)}</div>`}
}
function rpLops(){
  const k=$('#rpKhoi').value,ls=[...new Set(classes.filter(c=>!k||c.khoi==k).map(c=>c.lop))].sort(nat);
  $('#rpLop').innerHTML='<option value="">Tất cả lớp</option>'+ls.map(l=>`<option>${esc(l)}</option>`).join('');
}
const rpLater=()=>{clearTimeout(rpTimer);rpTimer=setTimeout(runReport,200)};
$('#rpKhoi').onchange=()=>{rpLops();rpLater()};
$('#rpLop').onchange=rpLater;$('#rpMonth').onchange=rpLater;
async function runReport(){
  if(!$('#rpMonth').value){$('#rpOut').innerHTML='<div class="msg wn">Chọn tháng cần xem.</div>';return}
  const my=++rpSeq,f={month:$('#rpMonth').value,khoi:$('#rpKhoi').value,lop:$('#rpLop').value};
  $('#rpOut').innerHTML='<p class="sub">Đang tải…</p>';$('#rpXls').disabled=true;
  try{
    const r=await api({action:'monthly',...f});
    if(my!==rpSeq)return;
    if(!r.ok)throw new Error(r.error);
    r.list.sort((a,b)=>nat(a.lop,b.lop));r.f=f;rpData=r;
    const S=k=>r.list.reduce((a,x)=>a+x[k],0),[y,m]=r.month.split('-');
    const who=f.lop?`Lớp ${f.lop}`:f.khoi?`Khối ${f.khoi}`:'Toàn trường';
    $('#rpOut').innerHTML=`<div class="card"><b>Tháng ${+m}/${y} · ${esc(who)}</b><br>${r.list.length} học sinh · ${r.days} buổi bán trú<br><span class="sub">Tổng: Đã nhận ${S('nhan')} · Vắng ${S('vang')} · Chưa nhận ${S('chua')}</span></div>`+
      `<div class="card"><div class="rp rph"><span>Học sinh</span><span>Đã nhận</span><span>Vắng</span><span>Chưa nhận</span></div>`+
      (r.list.length?r.list.map(x=>`<div class="row rp"><div>${esc(x.ten)}<small>Lớp ${esc(x.lop)}</small></div><span class="pill an">${x.nhan}</span><span class="pill vang">${x.vang}</span><span class="pill chua">${x.chua}</span></div>`).join(''):'<p class="sub">Không có học sinh.</p>')+'</div>';
    $('#rpXls').disabled=!r.list.length;
  }catch(e){if(my===rpSeq)$('#rpOut').innerHTML=`<div class="msg er">${esc(e.message)}</div>`}
}
// Xuất Excel (.xlsx). Thư viện chỉ tải khi bấm nút để trang chủ luôn nhẹ; không tải được thì xuất .csv mở bằng Excel
function loadXLSX(){return new Promise((ok,no)=>{
  if(window.XLSX)return ok();
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=()=>window.XLSX?ok():no();s.onerror=no;document.head.appendChild(s)})}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('#rpXls').onclick=async()=>{
  const r=rpData;if(!r)return;
  const [y,m]=r.month.split('-'),f=r.f,S=k=>r.list.reduce((a,x)=>a+x[k],0);
  const who=f.lop?`Lớp ${f.lop}`:f.khoi?`Khối ${f.khoi}`:'Toàn trường';
  const rows=[[`BÁO CÁO BÁN TRÚ THÁNG ${+m}/${y}`],[`${who} · ${r.days} buổi bán trú`],[],['STT','MSHS','Họ tên','Lớp','Đã nhận','Vắng','Chưa nhận']];
  r.list.forEach((x,i)=>rows.push([i+1,x.id,x.ten,x.lop,x.nhan,x.vang,x.chua]));
  rows.push(['','','Tổng','',S('nhan'),S('vang'),S('chua')]);
  const name=`bao-cao-ban-tru-${r.month}${f.lop?'-'+f.lop:f.khoi?'-khoi'+f.khoi:''}`;
  $('#rpXls').disabled=true;
  try{
    await loadXLSX();
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:6},{wch:10},{wch:30},{wch:8},{wch:10},{wch:8},{wch:11}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:6}},{s:{r:1,c:0},e:{r:1,c:6}}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,`Tháng ${m}-${y}`);
    XLSX.writeFile(wb,name+'.xlsx');
  }catch(e){
    const q=v=>`"${String(v).replace(/"/g,'""')}"`;
    download(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),name+'.csv');
  }
  $('#rpXls').disabled=false;
};

// ---- Quét QR: tải sẵn danh sách, hiện tên ngay, gửi ghi nhận chạy nền
let byId={},gotSet=new Set(),abSet=new Set(),ctx=null,sending=false;
let queue=[];try{queue=JSON.parse(localStorage.getItem('scQueue')||'[]')}catch(e){}
const saveQ=()=>{try{localStorage.setItem('scQueue',JSON.stringify(queue))}catch(e){}};
function beep(f,d){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.2;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function showQ(){$('#scQ').textContent=queue.length?`Đang gửi ${queue.length} lượt lên Sheet…`:'Đã đồng bộ với Sheet'}
$('#scLoginBtn').onclick=async()=>{
  const b=$('#scLoginBtn');b.disabled=true;$('#scLoginMsg').innerHTML='<p class="sub">Đang tải danh sách…</p>';
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    const p=$('#scPass').value,r=await api({action:'roster',pass:p});
    if(!r.ok)throw new Error(r.error);
    pass=p;byId={};r.list.forEach(x=>byId[x.id]=x);gotSet=new Set(r.got);abSet=new Set(r.ab);
    $('#scLogin').hidden=true;$('#scBox').hidden=false;$('#scLoginMsg').innerHTML='';
    startQR();showQ();flush();$('#scManual').focus();
  }catch(e){$('#scLoginMsg').innerHTML=`<div class="msg er">${esc(e.message)}</div>`}
  b.disabled=false;
};
function startQR(){
  qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
  qr.start({facingMode:'environment'},{fps:15,qrbox:240},txt=>{
    if(txt===last&&Date.now()-lastT<3000)return;last=txt;lastT=Date.now();doScan(txt);
  }).catch(()=>{$('#scMsg').innerHTML='<div class="msg er">Không mở được camera. Cho phép camera hoặc nhập mã tay.</div>'});
}
function stopQR(){if(qr){qr.stop().catch(()=>{});qr=null}if(!queue.length)pass='';$('#scLogin').hidden=false;$('#scBox').hidden=true;$('#scPass').value='';$('#scLoginMsg').innerHTML=''}
function doScan(raw){
  const id=String(raw).trim(),x=byId[id],m=$('#scMsg');
  if(!x){m.innerHTML=`<div class="msg er">Không có mã “${esc(id)}” trong danh sách</div>`;beep(220,.3);buzz([200,100,200]);return}
  if(gotSet.has(id)){m.innerHTML=`<div class="msg wn">${esc(x.ten)} (Lớp ${esc(x.lop)}) – đã nhận suất trước đó</div>`;beep(440,.25);buzz(150);return}
  gotSet.add(id);queue.push(id);saveQ();showQ();
  m.innerHTML=`<div class="msg ok">${esc(x.ten)} (Lớp ${esc(x.lop)}) – đã nhận suất${abSet.has(id)?'. Lưu ý: phụ huynh đã đăng ký vắng hôm nay.':''}</div>`;
  beep(900,.12);buzz(60);flush();
}
async function flush(){
  if(sending||!queue.length||!pass)return;
  sending=true;const batch=queue.slice();
  try{
    const r=await api({action:'scan',pass,ids:batch});
    if(!r.ok)throw new Error(r.error);
    queue=queue.slice(batch.length);saveQ();
  }catch(e){setTimeout(flush,5000)}
  sending=false;showQ();if(queue.length&&pass)flush();
}
const manual=()=>{const v=$('#scManual').value.trim();if(v){doScan(v);$('#scManual').value=''}$('#scManual').focus()};
$('#scManualBtn').onclick=manual;
$('#scManual').onkeydown=e=>{if(e.key==='Enter')manual()};
</script>
